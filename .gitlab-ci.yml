stages:
  - build

build-apk:
  stage: build
  image: mingc/android-build-box:latest
  script:
    - chmod +x ./gradlew
    - ./gradlew assembleDebug
  artifacts:
    name: "proxy-app-${CI_COMMIT_SHORT_SHA}"
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: never
  rules:
    - changes:
        - app/**/*
        - build.gradle
        - settings.gradle

build-docker-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - changes:
        - server/src/main/java/com/github/vgaj/proxy/ProxyServer.java
        - LICENSE
        - Dockerfile
